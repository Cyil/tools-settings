"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_mocha"
right_format = """"""

# 🎨 [Palette Definition] Catppuccin 莫卡经典色池
[palettes.catppuccin_mocha]
mauve     = "#cba6f7"
red       = "#f38ba8"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
sky       = "#89dceb"
blue      = "#89b4fa"
lavender  = "#b4befe"

# 📁 [Directory] 智能路径
[directory]
truncation_length = 6
truncate_to_repo = false
style = "bold sky"
read_only = " 󰌾"
read_only_style = "red"
truncation_symbol = "…/"
home_symbol = "  📁 ~"


# 🌿 [Git]
[git_branch]
symbol = " "
style = "bold mauve"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$num_stat]($style) )"
conflicted = "🏳 "
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "❓"
stashed = "📦"
modified = "📝"
staged = "✅"
renamed = "🚚"
deleted = "🗑 "

# ☕ [Java / Spring Boot]
[java]
symbol = " "
style = "bold peach"
format = "via [$symbol$version]($style) "

# 🐍 [Python / Flask]
[python]
symbol = " "
style = "bold yellow"
format = "via [$symbol$version]($style) "

# ☸️ [Kubernetes]
[kubernetes]
symbol = "󱃾 "
style = "bold blue"
format = "at [$symbol$context( \\($namespace\\))]($style) "
disabled = false

[character]
success_symbol = "[»](bold mauve) "
error_symbol = "[»](bold red) "

[aws]
symbol = " "
[azure]
symbol = " "
[docker_context]
symbol = " "
[nodejs]
symbol = " "
[package]
symbol = "󰏗 "
[rust]
symbol = "󱘗 "
[status]
symbol = " "
[sudo]
symbol = " "
